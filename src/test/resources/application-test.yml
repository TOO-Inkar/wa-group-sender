spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1

app:
  scheduling-enabled: false
  logging:
    dir: build/test-logs
  whatsapp:
    qr-png-path: build/test-data/qr/qr.png
    picture-dir: build/test-data/pictures
  message:
    template-path: build/test-data/templates/missing.txt
    contact: "Диспетчер (тест) +7 000 000 00 00"
    numbering: false
  groups:
    initial-sync-delay: 1h
  sheets:
    retry:
      initial-backoff: 1ms
      max-backoff: 2ms
  campaign:
    start-jitter-min: 0s
    start-jitter-max: 0s
  dispatch:
    autostart: false
    wave-size: 10
    wave-pause-min: 10m
    wave-pause-max: 20m
    group-pause-min: 20s
    group-pause-max: 60s
    typing-min: 2s
    typing-max: 6s
    idle-poll: 5s
    window-start: "08:00"
    window-end: "20:00"
    weekends-enabled: true
    hourly-limit: 0
    group-interval: 0s
    wait-for-reply: false
  warmup:
    enabled: false
    daily-limits: 45,80,120,170,220
  risk:
    window: 1h
    warn-threshold: 5
    critical-threshold: 10
    pause-multiplier: 2.0
  notify:
    telegram:
      bot-token: ""
  security:
    admin-token: test-token
    username: admin
    # пароль test-password
    password-hash: "$2y$04$J/gjAAVfgm959wSWo/HQC.OaWkoTODjlZOxyO/OOdYbiVT/XF4/vO"
  fake:
    groups: 30
    unarchived-groups: 3
    admin-only-groups: 2
    failure-rate: 0.0
    sheet-csv: ""
    sheet-state: ""

app:
  tenancy:
    require-proxy: false
  groups:
    initial-sync-delay: 2s
  sheets:
    enabled: ${SHEETS_ENABLED:true}
    poll-interval: 5s
    progress-flush-interval: 5s
  dispatch:
    wave-size: 10
    wave-pause-min: 5s
    wave-pause-max: 10s
    group-pause-min: 500ms
    group-pause-max: 1500ms
    typing-min: 200ms
    typing-max: 800ms
    idle-poll: 1s
    window-start: "00:00"
    window-end: "00:00"
    weekends-enabled: true

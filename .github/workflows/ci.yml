name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR-прогоны отменяют устаревшие, а push в main — нет: автодеплой ждёт зелёного CI именно этого коммита.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test
    # Раннеры GitHub: org-раннеры self-hosted жили на стенде inkbpadev и сейчас не в сети,
    # а на боевой сервер раннер не ставим — он выполнял бы код любого PR рядом с сессией WhatsApp.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          # Свой tmp на прогон: /tmp общий для всех юзеров хоста.
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports
          path: build/reports/tests
          retention-days: 7
          if-no-files-found: ignore

  # Админка: типы (в том числе сверка с OpenAPI бэкенда), линтер, тесты и сборка — как в Docker-образе.
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

# Выкатка на прод — не здесь: сервер сам забирает main после зелёного CI (scripts/autodeploy.sh на сервере)
# и отчитывается в GitHub проверкой «CD / production» и деплойментом production.

# wa-group-sender — системный nginx сервера inkbpadev.
#
# Ставится скриптом deploy/inkbpadev/setup-host.sh, руками так:
#   sudo cp deploy/inkbpadev/nginx-wa-group-sender.conf /etc/nginx/sites-available/wa-group-sender
#   sudo ln -s ../sites-available/wa-group-sender /etc/nginx/sites-enabled/wa-group-sender
#   sudo nginx -t && sudo systemctl reload nginx
#
# У сервера один адрес и нет доменных имён, сервисы разведены по портам
# (pharmnet — 8090–8092, task-manager — 8093/8096):
#
#   :8097 → контейнер wa-group-sender (127.0.0.1:8098, HTTP_PORT в .env)
#
# Без токена отвечает только /api/health; /api/qr, /api/groups и /api/admin/*
# требуют X-Admin-Token. TLS нет — токен идёт по локальной сети открытым.

server {
    listen 8097;
    listen [::]:8097;
    server_name _;

    access_log /var/log/nginx/wa-group-sender.access.log;
    error_log  /var/log/nginx/wa-group-sender.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
